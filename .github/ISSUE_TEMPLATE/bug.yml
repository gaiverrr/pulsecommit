name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste bot tokens, chat IDs, GitHub tokens, Health values or private repository contents.
  - type: input
    id: version
    attributes:
      label: App version and iOS version
      placeholder: Pulse Commit 1.0 (7), iOS 27.1
    validations:
      required: true
  - type: dropdown
    id: destination
    attributes:
      label: Destination
      options: [GitHub, Telegram, Both, Not destination-related]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include the error text from History if there is one.
    validations:
      required: true
