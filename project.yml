name: PulseCommit
options:
  bundleIdPrefix: app.pulsecommit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top

packages:
  HealthCore:
    path: Packages/HealthCore

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Paid Apple Developer Program team (Individual);
    # same ID as the former Personal Team. Not a secret — visible in any
    # signed binary. Hardcoded so `xcodegen generate` does not wipe the
    # Signing tab selection every regeneration.
    DEVELOPMENT_TEAM: "BDV4JKBRYU"
    CODE_SIGN_STYLE: Automatic

targets:
  PulseCommit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PulseCommit
      # BuildIdentity.swift lives under PulseCommit/Generated/ which is
      # .gitignored; xcodegen skips gitignored files by default, so it must
      # be added explicitly or the symbol BuildIdentity won't resolve.
      - path: PulseCommit/Generated/BuildIdentity.swift
        optional: true
    preBuildScripts:
      - name: "Generate BuildIdentity"
        basedOnDependencyAnalysis: false
        runOnlyWhenInstalling: false
        # Declared so the script can read git metadata under
        # ENABLE_USER_SCRIPT_SANDBOXING=YES (Xcode Cloud, hardened CI agents).
        # Without these inputs the sandbox blocks reads of .git/HEAD and
        # .git/index and the SHA silently falls back to "unknown".
        inputFiles:
          - $(SRCROOT)/.git/HEAD
          - $(SRCROOT)/.git/index
        outputFiles:
          - $(SRCROOT)/PulseCommit/Generated/BuildIdentity.swift
        script: |
          SHA=$(cd "$SRCROOT" && git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          DATE=$(cd "$SRCROOT" && git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M' 2>/dev/null || echo "unknown")
          OUT="$SRCROOT/PulseCommit/Generated/BuildIdentity.swift"
          mkdir -p "$(dirname "$OUT")"
          cat > "$OUT" <<EOF
          // Auto-generated by the build pre-action. Do not edit by hand.
          public enum BuildIdentity {
              public static let gitSHA = "$SHA"
              public static let commitDate = "$DATE"
          }
          EOF
    dependencies:
      - package: HealthCore
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PulseCommit/PulseCommit.entitlements
        CURRENT_PROJECT_VERSION: "8"
        MARKETING_VERSION: "1.0.1"
      configs:
        # Debug keeps the sideload identity so installed dev builds keep
        # their Keychain tokens and settings; Release is the App Store id.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.pulsecommit.gaiverrr
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: app.pulsecommit
    info:
      path: PulseCommit/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Pulse Commit
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Pulse Commit reads Apple Health data you select for manual exports to your GitHub repository or Telegram chat. If you separately turn on finished-workout messages, it also reads recently saved workouts in the background and sends one text summary to the Telegram chat and optional topic you approve."
        NSHealthUpdateUsageDescription: "Pulse Commit does not write to Apple Health. It only reads the data you select so you can export it to your GitHub repository or Telegram chat."
        LSApplicationQueriesSchemes:
          - shortcuts
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: PulseCommit/PulseCommit.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

  PulseCommitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PulseCommitTests
    dependencies:
      - target: PulseCommit
      # Test bundle is hosted by PulseCommit.app, which already statically
      # links HealthCore. Re-linking here duplicates symbols (loud after the
      # explicit type: .static pin in pc-6gd). `link: false` keeps the
      # swiftmodule visible for `import HealthCore` while skipping the link.
      - package: HealthCore
        link: false
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PulseCommit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PulseCommit"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        TARGETED_DEVICE_FAMILY: "1"
        GCC_TREAT_WARNINGS_AS_ERRORS: NO

  PulseCommitMarketingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PulseCommitMarketingUITests
    dependencies:
      - target: PulseCommit
    settings:
      base:
        TEST_TARGET_NAME: PulseCommit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        GCC_TREAT_WARNINGS_AS_ERRORS: NO
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  PulseCommitMarketing:
    build:
      targets:
        PulseCommit: all
        PulseCommitMarketingUITests: [test]
    test:
      config: Debug
      targets:
        - PulseCommitMarketingUITests
    run:
      config: Debug
  PulseCommit:
    build:
      targets:
        PulseCommit: all
        PulseCommitTests: [test]
    test:
      targets:
        - PulseCommitTests
    run:
      config: Debug
